<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join YourGallery – Register</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="shortcut icon" href="/favicon.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1 class="text-center">Join YourGallery</h1>
        <form action="/register" method="POST" enctype="multipart/form-data">
            <label>Email Address:</label>
            <input type="email" name="email" required placeholder="you@example.com">
            
            <label>Full Name:</label>
            <input type="text" name="name" required placeholder="John Doe">
            
            <label>Gender:</label>
            <select name="gender" required>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>
            
            <label>Age:</label>
            <input type="number" name="age" required min="1" max="120" placeholder="25">
            
            <label>Profile Picture (optional, max 2MB):</label>
            <input type="file" name="profile_pic" accept="image/*">
            
            <label>Password:</label>
            <input type="password" name="password" required minlength="6" placeholder="Minimum 6 characters">
            
            <button type="submit">Create Account</button>
        </form>
        <p class="text-center">Already have an account? <a href="/login">Login here</a></p>
    </div>
</body>
</html>
