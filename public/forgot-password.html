<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - YourGallery</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="shortcut icon" href="/favicon.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1 class="text-center">Reset Your Password</h1>
        <form action="/forgot-password" method="POST">
            <label>Email Address:</label>
            <input type="email" name="email" required placeholder="your-email@example.com">
            <p style="font-size: 0.9rem; color: #666; margin-top: -0.5rem;">We'll send you an OTP to reset your password.</p>
            <button type="submit">Send Reset OTP</button>
        </form>
        <p class="text-center"><a href="/login">Back to Login</a></p>
    </div>
</body>
</html>
