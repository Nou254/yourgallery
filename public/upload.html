<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Photo – YourGallery</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="shortcut icon" href="/favicon.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="nav">
        <a href="/">🏠 Home</a>
        <a href="/gallery">📷 Gallery</a>
        <a href="/upload">📤 Upload</a>
        <a href="/logout">🚪 Logout</a>
    </div>
    
    <div class="container">
        <h1 class="text-center">Upload Your Photo</h1>
        <form action="/upload" method="POST" enctype="multipart/form-data">
            <label>Choose Photo (max 5MB):</label>
            <input type="file" name="photo" accept="image/jpeg,image/png,image/jpg,image/gif" required>
            
            <label>Caption (optional):</label>
            <input type="text" name="caption" placeholder="Write something about this photo...">
            
            <button type="submit">Upload Photo</button>
        </form>
    </div>
</body>
</html>
