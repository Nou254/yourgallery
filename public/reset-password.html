<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - YourGallery</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="shortcut icon" href="/favicon.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1 class="text-center">Create New Password</h1>
        <form action="/reset-password" method="POST">
            <label>New Password:</label>
            <input type="password" name="password" required minlength="6" placeholder="Minimum 6 characters">
            
            <label>Confirm Password:</label>
            <input type="password" id="confirm" required placeholder="Retype your password">
            
            <button type="submit">Reset Password</button>
        </form>
    </div>
    
    <script>
        document.querySelector('form').addEventListener('submit', (e) => {
            const pass = document.querySelector('[name="password"]').value;
            const confirm = document.getElementById('confirm').value;
            if (pass !== confirm) {
                e.preventDefault();
                alert('Passwords do not match');
            } else if (pass.length < 6) {
                e.preventDefault();
                alert('Password must be at least 6 characters');
            }
        });
    </script>
</body>
</html>
